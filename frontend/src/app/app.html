<div
  class="app-layout"
  [class.app-layout--collapsed]="!sidebarExpanded()"
>
  <aside
    id="primary-navigation"
    class="sidebar"
    aria-label="Hauptnavigation"
  >
    <div class="sidebar__brand">
      <span class="sidebar-image" aria-hidden="true">
        <img src="/images/ear.png" alt="Mein Bild">
      </span>
      @if (sidebarExpanded()) {
        <span class="sidebar__brand-name">Mengenportal</span>
      }
    </div>

    <div class="sidebar__section-label">Arbeitsbereich</div>
    <mat-nav-list class="sidebar__navigation">
      <button
        mat-list-item
        type="button"
        [routerLink]="authService.isAuthenticated() ? '/mengenabgabe' : null"
        routerLinkActive="sidebar__link--active"
        ariaCurrentWhenActive="page"
        aria-label="Mengenabgabe"
        [disabled]="!authService.isAuthenticated()"
        [attr.aria-describedby]="!authService.isAuthenticated() ? 'mengenabgabe-login-hint' : null"
        [matTooltip]="authService.isAuthenticated() ? 'Mengenabgabe' : 'Bitte zuerst anmelden'"
        [matTooltipDisabled]="sidebarExpanded()"
        matTooltipPosition="right"
      >
        <mat-icon matListItemIcon>add_box</mat-icon>
        @if (sidebarExpanded()) {
          <span matListItemTitle class="sidebar__link-label">Mengenabgabe</span>
        }
      </button>
      @if (!authService.isAuthenticated()) {
        <div
          id="mengenabgabe-login-hint"
          class="sidebar__login-hint"
          role="status"
          aria-label="Bitte zuerst anmelden"
          matTooltip="Bitte zuerst anmelden"
          [matTooltipDisabled]="sidebarExpanded()"
          matTooltipPosition="right"
        >
          <mat-icon aria-hidden="true">info</mat-icon>
          @if (sidebarExpanded()) {
            <span>Bitte zuerst anmelden</span>
          }
        </div>
      }
      <a
        mat-list-item
        routerLink="/mengenabgabenanzeige"
        routerLinkActive="sidebar__link--active"
        ariaCurrentWhenActive="page"
        aria-label="Mengenabgabenanzeige"
        matTooltip="Mengenabgabenanzeige"
        [matTooltipDisabled]="sidebarExpanded()"
        matTooltipPosition="right"
      >
        <mat-icon matListItemIcon>view_list</mat-icon>
        @if (sidebarExpanded()) {
          <span matListItemTitle class="sidebar__link-label">Mengenabgabenanzeige</span>
        }
      </a>
    </mat-nav-list>

    <div class="sidebar__footer">
      <button
        mat-button
        type="button"
        class="sidebar__auth-button"
        [matTooltip]="authService.isAuthenticated() ? 'Abmelden' : 'Anmelden'"
        [matTooltipDisabled]="sidebarExpanded()"
        matTooltipPosition="right"
        (click)="authService.isAuthenticated() ? logout() : openLoginDialog()"
      >
        <mat-icon>{{ authService.isAuthenticated() ? 'logout' : 'login' }}</mat-icon>
        @if (sidebarExpanded()) {
          <span>{{ authService.isAuthenticated() ? 'Logout' : 'Login' }}</span>
        }
      </button>
    </div>
  </aside>

  <div class="main-panel">
    <mat-toolbar class="topbar">
      <button
        mat-icon-button
        type="button"
        aria-label="Seitenleiste ein- oder ausklappen"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="sidebarExpanded()"
        (click)="toggleSidebar()"
      >
        <mat-icon>{{ sidebarExpanded() ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
      <span class="topbar__title">Mengenverwaltung</span>
    </mat-toolbar>

    <main id="main-navigation" class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
